<html>
<head>
  <title>Reservation - La Pasta Bella</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <center>
    <h1> Reserve Your Table </h1>
    <marquee scrollamount="6" behavior="alternate"> ****Book now for an unforgettable Italian dining experience*** </marquee>
    <hr>
    
    <form>
      <b> Your Name:</b><br>
      <input type="text" placeholder="Enter Name" required>
      <br><hr>

      <b> Email Address:</b><br>
      <input type="email" placeholder="Enter Email" required>
      <br><hr>

      <b> Phone Number:</b><br>
      <input type="tel" placeholder="Enter Phone" required>
      <br><hr>

      <b> Date:</b><br>
      <input type="date" required>
      <br><hr>

      <b>Time:</b><br>
      <input type="time" required>
      <br><hr>

      <b> Number of Guests:</b><br>
      <select required>
        <option value="">Select Guests</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5+</option>
      </select>
      <br><hr>

      <button type="submit"> Book Now</button>
    </form>

    <hr>
    <p> Thank you! Your reservation has been received. </p>
  </center>
</body>
</html>
